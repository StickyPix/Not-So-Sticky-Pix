  - app
  region: flash_primary
  size: 0xaa800
  span: *primary_app_span
mcuboot_secondary:
  address: 0xb9000
  end_address: 0x164000
  region: flash_primary
  size: 0xab000
otp:
  address: 0xffd500
  end_address: 0xffd9fc
  region: otp
  size: 0x4fc
sram_primary:
  address: 0x20000000
  end_address: 0x2002f000
  region: sram_primary
  size: 0x2f000
