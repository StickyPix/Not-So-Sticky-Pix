# Stable MCUboot layout for nRF54L15 internal RRAM.
EMPTY_0:
  address: 0xd800
  end_address: 0xe000
  region: flash_primary
  size: 0x800
EMPTY_1:
  address: 0x164000
  end_address: 0x165000
  region: flash_primary
  size: 0x1000
app:
  address: 0xe800
  end_address: 0xb9000
  region: flash_primary
  size: 0xaa800
bootconf:
  address: 0xffd080
  end_address: 0xffd084
  region: bootconf
  size: 0x4
mcuboot:
  address: 0x0
  end_address: 0xd800
  region: flash_primary
  size: 0xd800
mcuboot_pad:
  address: 0xe000
  end_address: 0xe800
  region: flash_primary
  size: 0x800
mcuboot_primary:
  address: 0xe000
  end_address: 0xb9000
